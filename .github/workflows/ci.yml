name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: IMA adapters (offline; no credentials)
        run: |
          node scripts/test_ima_source.cjs
          node scripts/test_ima_catalog.cjs
      - name: Local corpus and rendering
        run: |
          python scripts/test_local_corpus.py
          python scripts/selfcheck.py
      - name: Research contracts
        run: |
          python scripts/test_ima_merge.py
          python scripts/test_research_audit.py
          python scripts/test_visuals.py
          python scripts/test_editorial.py
          python scripts/test_weekly_outlook.py
